default_agent = "ask"
enable_telemetry = false
default_approval_policy = "ask"
applied_migrations = [
    "bash_read_only_defaults_v1",
]

[tools.read_file]
permission = "always"

[tools.edit]
permission = "ask"

[tools.write_file]
permission = "ask"

[tools.bash]
permission = "ask"
allowlist = [
    "basename",
    "cat",
    "comm",
    "cut",
    "date",
    "diff",
    "dirname",
    "du",
    "file",
    "find",
    "fmt",
    "fold",
    "git diff",
    "git status",
    "grep",
    "head",
    "join",
    "less",
    "ls",
    "md5sum",
    "more",
    "nl",
    "npm run test:coverage",
    "npm run test:e2e",
    "npm test",
    "npx vitest run",
    "od",
    "paste",
    "pwd",
    "readlink",
    "sha1sum",
    "sha256sum",
    "shasum",
    "sort",
    "stat",
    "sum",
    "tac",
    "tail",
    "tr",
    "uname",
    "uniq",
    "wc",
    "which",
]

[tools.github_get_issue]
permission = "always"

[tools.github_search_issues]
permission = "always"

[tools.github_get_pull_request]
permission = "always"

[tools.github_create_issue]
permission = "always"

# mistral-vibe 3.x names MCP tools as <server>.<tool>; the observed runtime
# id is mcp_github.<tool> (see harness-poc run of 2026-11-23: issue_read was
# denied because the blocks above do not match it). Both spellings are kept.
[tools.mcp_github.issue_read]
permission = "always"

[tools.mcp_github.search_issues]
permission = "always"

[tools.mcp_github.pull_request_read]
permission = "always"
