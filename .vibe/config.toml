# Vibe project configuration - multi-agent harness PoC (project level)
# This file is read by the mistral-vibe CLI when the folder is trusted.
# Open the full config with: /config   |  Schema: vibe config schema

# Default agent: cautious. The orchestrator explicitly selects
# planner / coder / tester on each call, so this value only applies
# to your interactive sessions.
default_agent = "ask"

# Approval policy (mistral-vibe 3.x: agents no longer decide this).
# "ask" = any tool call not covered below by an "always" permission or an
# allowlist entry needs human approval; in programmatic mode such calls are
# simply denied and reported to the agent. The orchestrator passes
# --approval-policy accept-edits on the coder step so that file edits run.
default_approval_policy = "ask"

# ------------------------------------------------------------------
# Tool permissions (project level, apply to every agent).
# The bash allowlist is the single source of truth for which commands can
# run without approval (planner and reviewer have bash disabled anyway).
# ------------------------------------------------------------------
[tools.read_file]
permission = "always"

[tools.edit]
permission = "ask"

[tools.write_file]
permission = "ask"

[tools.bash]
permission = "ask"
allowlist = [
  "npm test",
  "npm run test:coverage",
  "npm run test:e2e",
  "npx vitest run",
  "git status",
  "git diff",
]

# ------------------------------------------------------------------
# Active model. First check the built-in models in an interactive
# session:   vibe   then   /model
# The CLI is designed for Devstral: if Devstral 2 shows up in /model,
# set it as active and delete the block below.
# ------------------------------------------------------------------
# active_model = "mistral-medium-latest"

# Devstral 2 preset on La Plateforme (uncomment AFTER verifying the
# exact model identifier in /model or on console.mistral.ai):
# [[models]]
# name = "devstral-2512"
# provider = "mistral"
# alias = "devstral-2"

# Telemetry disabled for the PoC.
enable_telemetry = false
