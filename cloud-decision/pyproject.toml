[project]
name = "cloud-decision"
version = "0.1.0"
description = "Hosted decision-only planner: analyzes an issue on label and posts its recommendation back to GitHub"
requires-python = ">=3.12"
dependencies = [
    "mistralai-workflows[mistralai]>=3.10",
    "mistralai-workflows-plugins-triggers>=0.1.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cloud_decision"]
