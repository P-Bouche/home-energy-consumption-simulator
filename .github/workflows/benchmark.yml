name: Benchmark

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Open3CL latency benchmark on the Node 24 reference runtime (.nvmrc).
# Runs unconditionally (the repo has shipped code since P0). Fails when
# p95 >= 3000 ms. Extend with `npm run benchmark:simulation` in P2.
jobs:
  benchmark:
    name: Open3CL p95 latency benchmark (Node from .nvmrc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run benchmark (fails when p95 >= 3000 ms)
        run: npm run benchmark
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P0-benchmark-report
          path: docs/phases/P0-benchmark-report.md
          retention-days: 14
