name: Benchmark

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Same guard pattern as ci.yml: until the P0 scaffolding (package.json) lands on
# main, this repository is documentation-only and the steps skip cleanly.
jobs:
  benchmark:
    name: Open3CL p95 latency benchmark (Node from .nvmrc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: hashFiles('package.json') != ''
      - uses: actions/setup-node@v4
        if: hashFiles('package.json') != ''
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        if: hashFiles('package.json') != ''
        run: npm ci
      - name: Run benchmark (fails when p95 >= 3000 ms)
        if: hashFiles('package.json') != ''
        run: npm run benchmark
      - name: Upload benchmark report
        if: always() && hashFiles('package.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: P0-benchmark-report
          path: docs/phases/P0-benchmark-report.md
          retention-days: 14
