name: Benchmark

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Open3CL latency benchmarks on the Node 24 reference runtime (.nvmrc).
# Runs unconditionally (the repo has shipped code since P0). Fails when
# p95 >= 3000 ms. Raw engine path: `npm run benchmark` (P0);
# building→simulation path: `npm run benchmark:simulation` (P2, AC-P2-01).
jobs:
  benchmark:
    name: Open3CL p95 latency benchmark (Node from .nvmrc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run benchmark (fails when p95 >= 3000 ms)
        run: npm run benchmark
      - name: Run building→simulation benchmark (fails when p95 >= 3000 ms, AC-P2-01)
        run: npm run benchmark:simulation
      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports
          path: |
            docs/phases/P0-benchmark-report.md
            docs/phases/P2-simulation-benchmark-report.md
          retention-days: 14
