name: E2E

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'tests/e2e/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e.yml'
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'tests/e2e/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Playwright e2e. The root playwright.config.ts starts the API
# (DATABASE_URL=memory://, in-memory repository) and the Vite dev server itself
# via `webServer`, so no service container and no manual server steps are needed.
# Job name is kept stable ("E2E (Playwright, AC-P1-05)") because branch
# protection on main requires it as a status check.
jobs:
  e2e:
    name: "E2E (Playwright, AC-P1-05)"
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright e2e tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      - name: Upload viewer screenshots (AC-P3-02 regression artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viewer-screenshots
          path: test-results/viewer-screenshots/
          retention-days: 14
